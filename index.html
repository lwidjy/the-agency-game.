  <script>
/* THE AGENCY: Football Agent Simulator. Fully client-side / offline-friendly game engine. */
(() => {
  'use strict';
  const STORAGE = 'the-agency-sim-v1';
  const $ = (s) => document.querySelector(s);
  const esc = (x) => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const euro = (n) => '€' + Math.round(Number(n) || 0).toLocaleString('en-US');
  const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
  const toInt = (x, fallback=0) => Number.isFinite(Number(x)) ? Math.round(Number(x)) : fallback;
  const PLAYERS = [
    {id:'p1',name:'Mateo Silva',age:19,position:'ST',nation:'Portugal',ovr:71,potential:89,value:3500000,advance:7000,wage:34000,personality:'Ambitious',club:'Port Azure FC',color:'#437a72',bio:'Explosive finisher with elite off-ball timing. Wants European nights.'},
    {id:'p2',name:'Elias Werner',age:21,position:'CM',nation:'Germany',ovr:76,potential:85,value:6100000,advance:10000,wage:48000,personality:'Loyal',club:'Rheinburg 04',color:'#615d89',bio:'Metronome midfielder who wants stable minutes and a long contract.'},
    {id:'p3',name:'Idrissa Diallo',age:18,position:'LW',nation:'Senegal',ovr:65,potential:91,value:1900000,advance:5000,wage:24000,personality:'Ambitious',club:'Atlantic Sporting',color:'#776b3e',bio:'Fearless teenage winger. Needs a club that promises first-team football.'},
    {id:'p4',name:'Nico Moretti',age:22,position:'CB',nation:'Italy',ovr:78,potential:84,value:7900000,advance:12000,wage:62000,personality:'Professional',club:'Torino Est',color:'#885c50',bio:'Dominant aerial defender whose leadership is beyond his years.'},
    {id:'p5',name:'Oliver Grant',age:20,position:'GK',nation:'England',ovr:68,potential:86,value:2100000,advance:5500,wage:28000,personality:'Loyal',club:'Northbridge United',color:'#487b92',bio:'Excellent reactions and composure. Prefers guaranteed starts.'},
    {id:'p6',name:'Youssef Amrani',age:23,position:'CDM',nation:'Morocco',ovr:74,potential:80,value:4800000,advance:8000,wage:40000,personality:'Professional',club:'Royal Castello',color:'#7d5b92',bio:'Relentless ball winner looking for a bigger challenge.'},
    {id:'p7',name:'Jae-min Park',age:19,position:'RW',nation:'South Korea',ovr:67,potential:88,value:2500000,advance:6000,wage:30000,personality:'Ambitious',club:'Seabrook Athletic',color:'#568179',bio:'Creative winger with quick feet and a global fan following.'},
    {id:'p8',name:'Rafael Costa',age:18,position:'ST',nation:'Brazil',ovr:60,potential:93,value:900000,advance:3500,wage:18000,personality:'Ambitious',club:'Union Belmar',color:'#807144',bio:'Raw prodigy who needs time to develop into a consistent scorer.'},
    {id:'p9',name:'Louis Bernard',age:22,position:'CM',nation:'France',ovr:72,potential:82,value:4200000,advance:7500,wage:36000,personality:'Loyal',club:'Montpellier Bleu',color:'#666a94',bio:'Technical distributor. Prioritizes good managers over glamour.'},
    {id:'p10',name:'Kofi Mensah',age:20,position:'CB',nation:'Ghana',ovr:69,potential:87,value:2800000,advance:6000,wage:31000,personality:'Professional',club:'Eastford City',color:'#5b8851',bio:'Quick recovering defender with bags of room to grow.'}
  ];
  const CLUBS = [
    {id:'c1',name:'Northbridge United',tier:'Elite',factor:1.20,roles:['Starter','Rotation'],maxWage:85000},
    {id:'c2',name:'Port Azure FC',tier:'Contender',factor:1.02,roles:['Starter','Prospect'],maxWage:68000},
    {id:'c3',name:'Royal Castello',tier:'Elite',factor:1.26,roles:['Starter','Rotation'],maxWage:105000},
    {id:'c4',name:'Rheinburg 04',tier:'Contender',factor:1.08,roles:['Starter','Rotation'],maxWage:76000},
    {id:'c5',name:'Torino Est',tier:'Development',factor:.91,roles:['Starter','Prospect'],maxWage:62000},
    {id:'c6',name:'Atlantic Sporting',tier:'Development',factor:.86,roles:['Starter','Prospect'],maxWage:56000},
    {id:'c7',name:'Seabrook Athletic',tier:'Contender',factor:1.05,roles:['Starter','Rotation'],maxWage:75000}
  ];
  let state = null;
  let activeTab = 'hq';
  let scoutFilter = 'ALL';
  let sortBy = 'potential';
  let modal = null;
  let toasting = 0;
  const app = $('#app');
  const init = () => ({version:1, agency:'',cash:30000,rep:20,week:1,clients:[],offers:[],deals:[],events:[],seq:1,loans:0,totalEarned:0,seasonEnded:false});
  function valid(raw){
    if(!raw||typeof raw!=='object'||raw.version!==1) return false;
    if(typeof raw.agency!=='string'||raw.agency.length>70||!Number.isInteger(raw.week)||raw.week<1||raw.week>12) return false;
    if(!Number.isFinite(raw.cash)||!Number.isFinite(raw.rep)||raw.rep<0||raw.rep>100||!Array.isArray(raw.clients)||!Array.isArray(raw.offers)||!Array.isArray(raw.deals)||!Array.isArray(raw.events)) return false;
    if(!Number.isInteger(raw.seq)||raw.seq<1||!Number.isFinite(raw.totalEarned)||!Number.isInteger(raw.loans)||raw.loans<0||raw.loans>1) return false;
    if(raw.clients.length>PLAYERS.length || new Set(raw.clients.map(c=>c.id)).size!==raw.clients.length) return false;
    if(!raw.clients.every(c=>c && PLAYERS.some(p=>p.id===c.id) && typeof c.club==='string' && Number.isFinite(c.ovr) && Number.isInteger(c.signedWeek))) return false;
    if(raw.offers.length>200||raw.deals.length>200||raw.events.length>500) return false;
    if(!raw.offers.every(o=>o && typeof o.id==='string' && PLAYERS.some(p=>p.id===o.playerId) && CLUBS.some(c=>c.id===o.clubId) && Number.isFinite(o.fee)&&o.fee>0&&Number.isFinite(o.wage)&&Number.isFinite(o.maxFee)&&Number.isFinite(o.maxWage) && Number.isInteger(o.expires))) return false;
    if(!raw.deals.every(d=>d && typeof d.id==='string' && Number.isFinite(d.fee) && Number.isFinite(d.commission))) return false;
    if(!raw.events.every(e=>e && typeof e.title==='string' && Number.isInteger(e.week) && e.week<=12)) return false;
    return true;
  }
  function load(){try{const r=localStorage.getItem(STORAGE);const parsed=r?JSON.parse(r):null;return valid(parsed)?parsed:init();}catch{return init();}}
  function save(){try{localStorage.setItem(STORAGE, JSON.stringify(state));}catch{toast('Browser storage unavailable. Export your save to avoid losing progress.');}}
  function logEvent(title,detail,delta=0){state.events.unshift({week:state.week,title,detail,delta});state.events=state.events.slice(0,120);}
  function commit(){save();render();}
  function toast(message){const el=$('#toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toasting);toasting=setTimeout(()=>el.classList.remove('show'),3500);}
  const getP=(id)=>PLAYERS.find(p=>p.id===id);
  const getC=(id)=>CLUBS.find(c=>c.id===id);
  const getClient=(id)=>state.clients.find(c=>c.id===id);
  const identifier=()=>String(state.seq++);
  const activeOffers=()=>state.offers.filter(o=>o.expires>=state.week && !o.done);
  const offerFor=(pid)=>activeOffers().some(o=>o.playerId===pid);
  const formatWeeks=(n)=>`${n} week${n===1?'':'s'}`;
  const getAgency=()=>esc(state.agency||'Your Agency');
  function offerGen(pid){
    const p=getP(pid), client=getClient(pid);
    if(!p||!client||offerFor(pid))return;
    const alternatives=CLUBS.filter(c=>c.name!==client.club);
    const club=alternatives[(state.seq*7 + p.age + state.week)%alternatives.length];
    let value=p.value*(client.ovr/p.ovr);
    const variation=.88+((state.seq*3+state.week*7)%19)/100;
    const fee= Math.round(value*club.factor*variation/50000)*50000;
    const maxFee= Math.round(fee*(1.09+state.rep/500)/50000)*50000;
    const wage=Math.round(Math.max(p.wage, p.wage*club.factor*.93)/1000)*1000;
    const maxWage=Math.max(wage+9000,Math.min(club.maxWage,Math.round(wage*(1.15+state.rep/500)/1000)*1000));
    const role=club.roles[(state.seq+state.week)%club.roles.length];
    const years=3;
    const offer={id:'o'+identifier(),playerId:pid,clubId:club.id,fee,wage,years,role,expires:Math.min(12,state.week+1),maxFee,maxWage,done:false,rounds:0};
    state.offers.push(offer);
    logEvent('New transfer approach',`${club.name} opened talks for ${p.name}.`);
    return offer;

  function signPlayer(id){
    const p=getP(id);if(!p||getClient(id))return toast('This player already has representation.');
    if(state.seasonEnded)return toast('Season complete. Start a new career.');
    if(state.cash<p.advance)return toast(`Need ${euro(p.advance-state.cash)} more to sign ${p.name}.`);
    state.cash-=p.advance;
    state.clients.push({id:p.id,club:p.club,ovr:p.ovr,morale:72,signedWeek:state.week,lastTransfer:0});
    logEvent('New client',`${p.name} signed with ${state.agency}. Representation advance paid.`, -p.advance);

  function acceptOffer(id,feeArg,wageArg,yearsArg,isCounter=false){
    const o=state.offers.find(o=>o.id===id);
    if(!o||o.done||o.expires<state.week||state.seasonEnded)return toast('That offer is no longer active.');
    const p=getP(o.playerId),client=getClient(o.playerId),club=getC(o.clubId);
    if(!client)return toast('The player is not your client.');
    const fee=toInt(feeArg,o.fee),wage=toInt(wageArg,o.wage),years=toInt(yearsArg,o.years);
    if(fee<50000 || wage<1000 || years<1 || years>5)return toast('Enter a valid fee, salary and 1 to 5 year contract.');
    if(isCounter){
      o.rounds=(o.rounds||0)+1;
      // A club makes an independent judgment against its real maximum budget.
      if(fee>o.maxFee || wage>o.maxWage || wage<p.wage || (p.personality==='Ambitious' && o.role==='Prospect' && wage<p.wage*1.16)){
        state.rep=clamp(state.rep-1,0,100);
        logEvent('Counteroffer rejected',`${club.name} rejected your terms for ${p.name}.`);
        modal=null;commit();toast('Club rejected those terms. Original offer still available.');return;
      }
    }else if(wage<p.wage){
      toast(`${p.name} wants at least ${euro(p.wage)} per week.`);return;
    }
    if(client.club===club.name)return toast('Player is already at that club.');
    const commission=Math.round(fee*.05);
    o.done=true;client.club=club.name;client.lastTransfer=state.week;client.morale=clamp(client.morale+8,0,100);
    const deal={id:'d'+identifier(),playerId:p.id,clubId:club.id,week:state.week,fee,wage,years,commission,role:o.role};
    state.deals.push(deal);state.cash+=commission;state.totalEarned+=commission;state.rep=clamp(state.rep+8,0,100);
    state.offers=state.offers.filter(x=>x.id===id || x.playerId!==p.id);
    logEvent('DEAL CLOSED',`${p.name} → ${club.name} for ${euro(fee)}. Agency earned a 5% commission of ${euro(commission)}.`,commission);
    modal=null;commit();toast(`TRANSFER COMPLETE! +${euro(commission)} commission`);
  }
  function advanceWeek(){
    if(state.week>=12){state.seasonEnded=true;activeTab='career';modal=null;commit();return;}
    if(state.cash<1500){modal={type:'funding'};renderModal();return;}
    const prevWeek=state.week;
    state.cash-=1500;state.week++;
    logEvent('Office expenses',`Overhead for the transition from week ${prevWeek} to week ${state.week}.`,-1500);
    for(const c of state.clients){
      const p=getP(c.id);
      if(state.week%3===0 && c.ovr<p.potential && (p.age+state.week)%3!==0){c.ovr+=1;logEvent('Player development',`${p.name} improved to ${c.ovr} OVR.`);}
      c.morale=clamp(c.morale+(((state.week+p.age)%3)-1)*2,35,98);
    }
    const expired=state.offers.filter(o=>!o.done && o.expires<state.week).length;
    state.offers=state.offers.filter(o=>o.done || o.expires>=state.week);
    if(expired)logEvent('Offers expired',`${expired} offer${expired===1?'':'s'} expired without a deal.`);
    const eligible=state.clients.filter(c=>!offerFor(c.id) && state.week-c.lastTransfer>=2).sort((a,b)=>a.lastTransfer-b.lastTransfer);
    eligible.slice(0,Math.min(3,1+Math.floor(state.rep/45))).forEach(c=>offerGen(c.id));
    if(state.week===12){logEvent('Final week',"This is the final week of the season. Close your deals before ending the season.");}
    modal=null;commit();toast(`Welcome to Week ${state.week}. Fresh market updates are in!`);
  }

    }else if(modal.type==='sign'){const p=getP(modal.id);html=`<div class="eyebrow">REPRESENTATION AGREEMENT</div><h2>Sign ${esc(p.name)}?</h2><p>Representation advance <b class="lime">${euro(p.advance)}</b> will be deducted from your wallet. This makes ${esc(p.name)} your client and opens a new club offer immediately.</p><div class="notice">Current wallet: ${euro(state.cash)}<br>After signing: ${euro(state.cash-p.advance)}</div><div class="modal-action" style="margin-top:16px"><button class="btn primary" data-act="sign" data-id="${p.id}">CONFIRM SIGNING</button><button class="btn" data-act="modal-close">CANCEL</button></div>`;
    }else if(modal.type==='offer'){const o=state.offers.find(x=>x.id===modal.id);if(!o||o.done)return modal=null,render();const p=getP(o.playerId),club=getC(o.clubId);html=`<div class="eyebrow">NEGOTIATION ROOM</div><h2>${esc(club.name)}</h2><p>Negotiate for <b>${esc(p.name)}</b>. A bigger transfer fee makes your 5% agency commission bigger, but the club has a real ceiling. Wages belong to your player.</p><form id="counter-form" data-id="${o.id}"><div class="fields"><div class="field"><label>Transfer fee (€)</label><input class="input" name="fee" type="number" min="50000" step="50000" value="${o.fee}" required></div><div class="field"><label>Player weekly wage (€)</label><input class="input" name="wage" type="number" min="1000" step="1000" value="${o.wage}" required></div><div class="field"><label>Years</label><select name="years">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===o.years?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="notice">Club fee ceiling: <b>${euro(o.maxFee)}</b><br>Club wage ceiling: <b>${euro(o.maxWage)}/wk</b><br>Player minimum: <b>${euro(p.wage)}/wk</b><br>Role offered: <b>${esc(o.role)}</b></div><div class="modal-action" style="margin-top:16px"><button class="btn primary" type="submit">SUBMIT COUNTEROFFER</button><button class="btn" type="button" data-act="offer-accept-confirm" data-id="${o.id}">ACCEPT ORIGINAL</button></div></form>`;
    }else if(modal.type==='accept'){const o=state.offers.find(x=>x.id===modal.id);if(!o)return;html=`<div class="eyebrow">FINAL APPROVAL</div><h2>Confirm the transfer?</h2><p>${esc(getP(o.playerId).name)} → ${esc(getC(o.clubId).name)}</p><div class="notice">Fee: <b>${euro(o.fee)}</b><br>Player wages: <b>${euro(o.wage)}/week</b><br>Commission to your agency: <b class="lime">${euro(o.fee*.05)}</b><br>This deal cannot be reversed.</div><div class="modal-action" style="margin-top:16px"><button class="btn primary" data-act="offer-accept" data-id="${o.id}">CLOSE DEAL</button><button class="btn" data-act="modal-close">GO BACK</button></div>`;
    }else if(modal.type==='reject'){const o=state.offers.find(x=>x.id===modal.id);html=`<h2>Reject this offer?</h2><p>${esc(getC(o.clubId).name)} will withdraw their proposal. You can wait for new opportunities in future weeks.</p><div class="modal-action"><button class="btn danger" data-act="offer-reject" data-id="${o.id}">REJECT OFFER</button><button class="btn" data-act="modal-close">KEEP OFFER</button></div>`;
    }else if(modal.type==='week'){html=`<div class="eyebrow">WEEK ${state.week} / 12</div><h2>${state.week===12?'End the season?':'Advance to next week?'}</h2><p>${state.week===12?'Finish the season and view your final career score.':'Pay €1,500 in office costs, update player development, expire old offers and receive new club approaches.'}</p><div class="notice">Agency wallet: ${euro(state.cash)}<br>${state.week<12?`After office expenses: <b>${euro(state.cash-1500)}</b>`:'Final results are based on your completed deals and finances.'}</div><div class="modal-action" style="margin-top:16px"><button class="btn primary" data-act="week-advance">${state.week===12?'FINISH SEASON':'CONFIRM NEXT WEEK'}</button><button class="btn" data-act="modal-close">CANCEL</button></div>`;
    }else if(modal.type==='funding'){html=`<div class="eyebrow">CASH FLOW PROBLEM</div><h2>Can't cover office costs</h2><p>You need €1,500 to operate next week. A one-time fictional emergency sponsor can inject €10,000 at a cost of 10 reputation points.</p><div class="modal-action">${!state.loans?`<button class="btn primary" data-act="funding">TAKE €10,000 SPONSORSHIP</button>`:`<span class="tag red">SPONSORSHIP ALREADY USED</span>`}<button class="btn" data-act="modal-close">CANCEL</button></div>`;
    }else if(modal.type==='reset'){html=`<div class="eyebrow">DANGER ZONE</div><h2>Delete this career?</h2><p>This will permanently reset all clients, money, deals and achievements in this browser. Export your save first if you want to keep it.</p><div class="modal-action"><button class="btn danger" data-act="reset">YES, RESET EVERYTHING</button><button class="btn" data-act="modal-close">KEEP MY SAVE</button></div>`;
    }else if(modal.type==='settings'){html=`<h2>Save Management</h2><p>Export a backup before clearing browser data. Progress does not sync across devices.</p><div class="modal-action"><button class="btn primary" data-act="export">EXPORT SAVE</button><button class="btn" data-act="import">IMPORT SAVE</button><button class="btn danger" data-act="reset-confirm">RESET CAREER</button></div><input type="file" style="display:none" id="importfile" accept=".json,application/json">`;
    }
    popup(html);
  }
  document.addEventListener('submit',event=>{
    if(event.target?.id==='start-form'){
      event.preventDefault();const name=($('#agency-name')?.value||'').trim();if(!name)return toast('Give your agency a name first.');
      state=init();state.agency=name.slice(0,40);logEvent('Agency founded',`${state.agency} began its football journey with ${euro(30000)}.`);activeTab='hq';commit();toast('Agency launched. Time to scout talent.');
    }else if(event.target?.id==='counter-form'){
      event.preventDefault();const f=event.target,offerId=f.dataset.id;
      acceptOffer(offerId,f.elements.fee.value,f.elements.wage.value,f.elements.years.value,true);
    }
  });
  document.addEventListener('change',e=>{if(e.target?.id==='sort-select'){sortBy=e.target.value;render();}if(e.target?.id==='importfile')importFile(e.target.files?.[0]);});
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab],[data-act]');
    if(!t){if(e.target.classList?.contains('modal-back')){modal=null;render();}return;}
    if(t.dataset.tab){activeTab=t.dataset.tab;modal=null;render();window.scrollTo({top:0,behavior:'instant'});return;}
    const action=t.dataset.act,id=t.dataset.id;
    switch(action){
      case 'filter':scoutFilter=id;render();break;
      case 'player-view':modal={type:'player',id};renderModal();break;
      case 'sign-confirm':modal={type:'sign',id};renderModal();break;
      case 'sign':signPlayer(id);break;
      case 'offer-view':modal={type:'offer',id};renderModal();break;
      case 'offer-accept-confirm':modal={type:'accept',id};renderModal();break;
      case 'offer-accept':acceptOffer(id);break;
      case 'offer-reject-confirm':modal={type:'reject',id};renderModal();break;
      case 'offer-reject':{let o=state.offers.find(o=>o.id===id);if(o&&!o.done){o.done=true;logEvent('Offer declined',`Rejected ${getC(o.clubId).name}'s approach for ${getP(o.playerId).name}.`);state.rep=clamp(state.rep-1,0,100);modal=null;commit();toast('Offer rejected.');}break;}
      case 'week-confirm':modal={type:'week'};renderModal();break;
      case 'week-advance':advanceWeek();break;
      case 'funding':if(state.loans)return;state.loans=1;state.cash+=10000;state.rep=clamp(state.rep-10,0,100);logEvent('Emergency sponsorship','One-time €10,000 cash injection, with a 10-point reputation cost.',10000);modal=null;commit();toast('Sponsorship secured. You can advance the week now.');break;
      case 'settings':modal={type:'settings'};renderModal();break;
      case 'export':exportFile();break;
      case 'import':{const chooser=$('#importfile');if(chooser)chooser.click();break;}
      case 'reset-confirm':modal={type:'reset'};renderModal();break;
      case 'reset':state=init();modal=null;activeTab='hq';commit();toast('Career reset.');break;
      case 'modal-close':modal=null;render();break;
    }
  });
  function exportFile(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='the-agency-career-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Career save exported.');}
  async function importFile(file){if(!file)return;try{if(file.size>3000000)throw Error('File is too large.');const data=JSON.parse(await file.text());if(!valid(data))throw Error('Invalid or incompatible game save.');if(!window.confirm('Replace your current career with this backup?'))return;state=data;modal=null;activeTab='hq';commit();toast('Save restored successfully.');}catch(err){toast('Import failed: '+err.message);}}
  state=load();render();
})();

</script>
</body>
</html>
